<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agent Orchestration Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.0/dist/morphdom-umd.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
        colors: {
          zinc: { 950:'#09090b' }
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent:#8b5cf6; --accent2:#06b6d4; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; }
  html,body{background:#09090b;color:#e4e4e7;font-family:Inter,system-ui,sans-serif}
  .grad-text{background:linear-gradient(120deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .glass{background:linear-gradient(180deg,rgba(24,24,27,.75),rgba(9,9,11,.6));backdrop-filter:blur(10px);border:1px solid rgba(63,63,70,.6)}
  .card-hover{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;will-change:transform}
  .card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px -12px rgba(139,92,246,.25)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
  .anim-fadeup{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
  .anim-scale{animation:scaleIn .4s cubic-bezier(.2,.8,.2,1) both}
  .stagger > *{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
  .stagger > *:nth-child(1){animation-delay:.05s}
  .stagger > *:nth-child(2){animation-delay:.1s}
  .stagger > *:nth-child(3){animation-delay:.15s}
  .stagger > *:nth-child(4){animation-delay:.2s}
  .stagger > *:nth-child(5){animation-delay:.25s}
  .stagger > *:nth-child(6){animation-delay:.3s}
  .running-dot{width:8px;height:8px;border-radius:9999px;background:#22c55e;animation:pulseDot 1.6s ease-in-out infinite}
  .progress-bar{background:linear-gradient(90deg,#8b5cf6,#22d3ee);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
  .scrollbox{scrollbar-width:thin;scrollbar-color:#3f3f46 transparent}
  .scrollbox::-webkit-scrollbar{width:8px;height:8px}
  .scrollbox::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:4px}
  .scrollbox::-webkit-scrollbar-track{background:transparent}
  .bubble{white-space:pre-wrap;word-break:break-word}
  .copy-btn{transition:all .2s}
  .copy-btn:active{transform:scale(.95)}
</style>
</head>
<body class="min-h-screen antialiased">
  <!-- animated background -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-md bg-violet-600/20 blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 rounded-md bg-cyan-500/15 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 w-96 h-96 rounded-md bg-fuchsia-600/10 blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-20 border-b border-zinc-800/80 bg-zinc-950/70 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-violet-500/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold leading-tight">Orchestration <span class="grad-text">Dashboard</span></h1>
          <p class="text-[11px] text-zinc-500 leading-tight">live agent visualizer</p>
        </div>
      </div>
      <div id="status-pill" class="px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-900 border border-zinc-800 text-zinc-300 shadow-sm">loading…</div>
      <div id="hb-pill" class="hidden sm:block px-3 py-1.5 rounded-md text-xs font-medium bg-zinc-900 border border-zinc-800 text-zinc-300 shadow-sm">heartbeat…</div>
      <div id="counts" class="hidden sm:block text-xs text-zinc-500 ml-auto"></div>
      <div id="refresh-info" class="text-xs text-zinc-600"></div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <section id="totals" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4 mb-6 sm:mb-8 stagger"></section>
    <section id="threads" class="space-y-4 sm:space-y-6"></section>
  </main>

<script>
const fmtSec = (s) => {
  if (s == null) return '—';
  if (s < 60) return s+'s';
  if (s < 3600) return Math.floor(s/60)+'m '+(s%60)+'s';
  return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';
};
const fmtNum = (n) => (n==null?'—':Number(n).toLocaleString());
const esc = (s) => String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let lastData = null;

async function load() {
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    const d = await r.json();
    lastData = d;
    render(d);
    document.getElementById('refresh-info').textContent = 'updated '+new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('refresh-info').textContent = 'error: '+e.message;
  }
}

function render(d) {
  const sp = document.getElementById('status-pill');
  sp.textContent = d.status || 'no status';
  sp.className = 'px-3 py-1.5 rounded-md text-xs font-medium bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';

  const hb = document.getElementById('hb-pill');
  hb.textContent = 'heartbeat ' + (d.heartbeat.alive ? 'alive' : 'DEAD');
  hb.className = 'px-3 py-1.5 rounded-md text-xs font-medium ' + (d.heartbeat.alive
    ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300'
    : 'bg-red-500/10 border border-red-500/30 text-red-300');

  document.getElementById('counts').textContent = d.threadCount+' threads · '+d.runningCount+' running';

  const t = d.totals;
  const totalsHtml = `
    ${statCard('Threads', d.threadCount, 'from-zinc-700 to-zinc-500')}
    ${statCard('Running', d.runningCount, 'from-emerald-600 to-emerald-400')}
    ${statCard('Token In', fmtNum(t.input), 'from-violet-600 to-violet-400')}
    ${statCard('Token Out', fmtNum(t.output), 'from-cyan-600 to-cyan-400')}
    ${statCard('Tool Calls', fmtNum(t.toolCalls), 'from-fuchsia-600 to-fuchsia-400')}
    ${statCard('LLM Steps', fmtNum(t.steps), 'from-amber-600 to-amber-400')}
  `;
  const totalsTmp = document.createElement('div');
  totalsTmp.innerHTML = totalsHtml;
  morphdom(document.getElementById('totals'), totalsTmp, { childrenOnly: true });

  const container = document.getElementById('threads');
  if (!d.threads.length) {
    const tmp = document.createElement('div');
    tmp.innerHTML = '<div class="text-center py-20 text-zinc-500">No threads found.</div>';
    morphdom(container, tmp, { childrenOnly: true });
    return;
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = d.threads.map(threadCard).join('');
  morphdom(container, tmp, { childrenOnly: true });
}

function statCard(label, val, grad) {
  return `
  <div class="glass rounded-2xl p-4 anim-scale card-hover">
    <div class="text-[11px] uppercase tracking-wider text-zinc-500 font-medium">${label}</div>
    <div class="mt-1 text-2xl sm:text-3xl font-extrabold bg-gradient-to-r ${grad} bg-clip-text text-transparent">${val}</div>
  </div>`;
}

function badgeClass(s) {
  if (s === 'running') return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
  if (s === 'done') return 'bg-violet-500/15 text-violet-300 border-violet-500/30';
  if (String(s).startsWith('failed')) return 'bg-red-500/15 text-red-300 border-red-500/30';
  return 'bg-zinc-700/40 text-zinc-300 border-zinc-600/40';
}

function threadCard(t) {
  const toolsHtml = Object.entries(t.log.toolsByName).map(([n,c]) =>
    `<span class="px-2.5 py-1 rounded-lg text-xs bg-zinc-900 border border-zinc-800"><span class="text-violet-300 font-medium">${esc(n)}</span> <span class="text-zinc-500">×${c}</span></span>`).join('');
  const recentTools = t.log.recentTools.slice().reverse().map(x =>
    `<span class="px-2.5 py-1 rounded-lg text-xs bg-zinc-900 border border-zinc-800 ${x.status==='completed'?'border-emerald-500/30':'border-amber-500/30'}"><span class="text-cyan-300">${esc(x.name)}</span></span>`).join('');
  const lastText = t.log.lastText ? esc(t.log.lastText) : '<span class="text-zinc-600 italic">no text yet…</span>';
  const stalledBadge = t.stalled ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30">STALLED</span>' : '';
  const branch = t.branch ? esc(t.branch) + (t.dirtyCount?` <span class="text-amber-400">(${t.dirtyCount} dirty)</span>`:'') : '—';
  const lastActivity = t.lastActivity ? new Date(t.lastActivity).toLocaleString() : '—';
  const totalTokens = (t.log.tokens.input + t.log.tokens.output) || 1;
  const outPct = Math.min(100, Math.round(t.log.tokens.output / totalTokens * 100));
  const worktreeShort = esc((t.worktree||'').split('/').slice(-2).join('/'));
  const startedStr = t.started ? new Date(t.started*1000).toLocaleString() : '—';
  const endedStr = t.state==='running' ? 'running…' : (t.ended ? new Date(t.ended*1000).toLocaleString() : '—');

  const html = `
  <article id="thread-${esc(t.name)}" class="glass rounded-3xl p-4 sm:p-6 card-hover border border-zinc-800/60">
    <!-- header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="relative flex-shrink-0">
          ${t.state==='running' ? '<span class="running-dot absolute -top-1 -right-1"></span>' : ''}
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-500/30 to-cyan-500/30 border border-violet-500/30 flex items-center justify-center text-lg">🤖</div>
        </div>
        <div class="min-w-0">
          <h2 class="text-base sm:text-lg font-bold truncate">${esc(t.name)}</h2>
          <p class="text-xs text-zinc-500 truncate">${esc(t.model||'—')}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${badgeClass(t.state)}">${esc(t.state)}</span>
        ${stalledBadge}
        <span class="px-2.5 py-1 rounded-lg text-xs bg-zinc-900 border border-zinc-800 text-zinc-400">pid ${esc(t.pid)}</span>
      </div>
    </div>

    <!-- meta grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3 mb-4">
      ${meta('Elapsed', fmtSec(t.elapsedSec))}
      ${meta('Started', startedStr)}
      ${meta('Ended', endedStr)}
      ${meta('Session', esc(t.session||'—'))}
      ${meta('Branch', branch)}
      ${meta('Worktree', worktreeShort)}
      ${meta('Last activity', lastActivity)}
      ${meta('Events / Tools / Steps', t.log.events+' / '+t.log.toolCalls+' / '+t.log.steps)}
    </div>

    <!-- progress -->
    <div class="mb-4">
      <div class="flex items-center justify-between text-xs text-zinc-500 mb-1.5">
        <span>Output token share</span>
        <span>${outPct}%</span>
      </div>
      <div class="h-2 rounded-md bg-zinc-900 overflow-hidden border border-zinc-800">
        <div class="progress-bar h-full rounded-md transition-all duration-700" style="width:${outPct}%"></div>
      </div>
      <div class="mt-2 text-[11px] text-zinc-500 flex flex-wrap gap-x-4 gap-y-1">
        <span>in <span class="text-zinc-300">${fmtNum(t.log.tokens.input)}</span></span>
        <span>out <span class="text-zinc-300">${fmtNum(t.log.tokens.output)}</span></span>
        <span>cache <span class="text-zinc-300">${fmtNum(t.log.tokens.cacheRead)}</span></span>
        <span>cost <span class="text-zinc-300">$${t.log.cost.toFixed(4)}</span></span>
      </div>
    </div>

    <!-- latest message -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">Latest message</h3>
        <button onclick="copyLatest('${esc(t.name)}')" class="copy-btn px-2.5 py-1 rounded-lg text-xs bg-zinc-900 border border-zinc-800 text-zinc-300 hover:border-violet-500/50 hover:text-violet-300">Copy</button>
      </div>
      <div id="bubble-${esc(t.name)}" class="bubble-scroll scrollbox rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 sm:p-4 max-h-44 overflow-auto" data-thread="${esc(t.name)}">
        <div class="bubble text-sm leading-relaxed text-zinc-200">${lastText}</div>
      </div>
    </div>

    <!-- recent tools -->
    <div class="mb-4">
      <h3 class="text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">Recent tool calls</h3>
      <div class="flex flex-wrap gap-1.5">${recentTools || '<span class="text-xs text-zinc-600 italic">none yet</span>'}</div>
    </div>

    <!-- tool totals -->
    <div class="mb-4">
      <h3 class="text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">Tool usage totals</h3>
      <div class="flex flex-wrap gap-1.5">${toolsHtml || '<span class="text-xs text-zinc-600 italic">none</span>'}</div>
    </div>

    ${t.stderr ? `
    <div class="mb-4">
      <h3 class="text-xs uppercase tracking-wider text-red-400 font-semibold mb-2">stderr (tail)</h3>
      <pre class="scrollbox rounded-2xl bg-red-950/30 border border-red-900/40 p-3 text-xs text-red-300 max-h-32 overflow-auto whitespace-pre-wrap">${esc(t.stderr)}</pre>
    </div>` : ''}

    <details class="group">
      <summary class="cursor-pointer text-xs text-zinc-500 hover:text-zinc-300 select-none">Prompt (head)</summary>
      <pre class="mt-2 scrollbox rounded-2xl bg-zinc-950/60 border border-zinc-800 p-3 text-xs text-zinc-400 max-h-40 overflow-auto whitespace-pre-wrap">${esc(t.prompt)}</pre>
    </details>
  </article>`;
  if (t.state !== 'running') {
    const inner = html.trim().replace(/^<article[^>]*>/, '').replace(/<\/article>$/, '');
    return `<details id="thread-${esc(t.name)}" class="glass rounded-2xl border border-zinc-800/60 group overflow-hidden">
      <summary class="flex items-center justify-between gap-3 p-4 cursor-pointer list-none hover:bg-zinc-900/40">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500/20 to-cyan-500/20 border border-violet-500/20 flex items-center justify-center text-base flex-shrink-0">🤖</div>
          <div class="min-w-0">
            <div class="text-sm font-semibold truncate">${esc(t.name)}</div>
            <div class="text-[11px] text-zinc-500 truncate">${esc(t.model||'—')} · ${fmtSec(t.elapsedSec)} · ${t.log.toolCalls} tools</div>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold border ${badgeClass(t.state)}">${esc(t.state)}</span>
          <svg class="w-4 h-4 text-zinc-500 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </summary>
      <div class="px-4 pb-4 pt-2 border-t border-zinc-800/60">${inner}</div>
    </details>`;
  }
  return html;
}

function meta(k,v) {
  return `<div class="rounded-xl bg-zinc-900/60 border border-zinc-800/60 px-3 py-2">
    <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium">${k}</div>
    <div class="text-xs text-zinc-200 font-medium mt-0.5 break-all">${v}</div>
  </div>`;
}

function copyLatest(name) {
  const t = lastData && lastData.threads.find(x => x.name === name);
  const text = (t && t.log && t.log.lastText) || '';
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else fallback();
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
